name: daily-update
on:
  schedule:
    - cron: "0 3 * * *"   # 06:00 МСК ежедневно
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch weather (Open-Meteo)
        run: node scripts/fetch_weather.mjs
      - name: Fetch outbreaks (WOAH WAHIS, haversine geo)
        run: node scripts/fetch_outbreaks.mjs
      - name: Rebuild eBird phenology (deterministic, if migration changed)
        run: node scripts/build_ebird_phenology.mjs
      - name: Fetch wind (Open-Meteo, border points)
        run: node scripts/fetch_wind.mjs
      - name: Fetch trajectories (v2.5, backward trajectories from nodes)
        run: node scripts/fetch_trajectories.mjs
      - name: Rebuild model
        run: node scripts/build_model.mjs
      - name: OG image (PIL)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/make_og.py
      - name: Telegram alert (on level change)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send_alert.mjs
      - name: Commit data
        run: |
          git config user.name "vetflu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/model.json data/ebird_phenology.json data/weather.json data/climate_cache.json data/outbreaks_live.json data/wind_live.json data/wind_traj.json data/history.json data/alert_state.json feed.xml og-image.png
          git diff --cached --quiet || (git commit -m "daily update $(date -u +%F)" && git push)
