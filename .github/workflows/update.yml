name: daily-update
on:
  schedule:
    - cron: "0 3 * * *"   # 06:00 МСК ежедневно
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch weather (Open-Meteo)
        run: node scripts/fetch_weather.mjs
      - name: Fetch outbreaks (WOAH WAHIS)
        run: node scripts/fetch_outbreaks.mjs
      - name: Rebuild model
        run: node scripts/build_model.mjs
      - name: Commit data
        run: |
          git config user.name "vetflu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/model.json data/weather.json data/climate_cache.json data/outbreaks_live.json
          git diff --cached --quiet || (git commit -m "daily update $(date -u +%F)" && git push)
